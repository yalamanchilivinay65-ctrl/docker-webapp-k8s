# Local smoke test before pushing images:  docker compose up --build
# Then open http://localhost:8080 and register a new user to test
services:
  devopsdb:
    image: ysv26/dbimage:v1
    environment:
      MYSQL_ROOT_PASSWORD: localrootpass
      MYSQL_USER: vprofile
      MYSQL_PASSWORD: localapppass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12

  app:
    image: ysv26/appimage:v1
    ports:
      - "1234:8080"
    environment:
      JDBC_URL: "jdbc:mysql://devopsdb:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false"
      JDBC_USERNAME: vprofile
      JDBC_PASSWORD: localapppass
    depends_on:
      devopsdb:
        condition: service_healthy
